services:
  - type: web
    name: cempulse
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && CI=false npm run build --prefix client
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REACT_APP_API_URL
        value: /api
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h